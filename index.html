<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>srt notes</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-2: #1b2434;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f6fb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --pin: #f59e0b;
      --alarm: #a855f7;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      max-width: 100%;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 15, 23, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.2px;
      cursor: pointer;
      min-width: 0;
    }

    .brand img {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .brand-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      user-select: none;
    }

    button:active {
      transform: scale(0.97);
    }

    button.primary {
      background: var(--accent);
      color: #06131d;
      border-color: transparent;
    }

    button.success {
      background: var(--accent-2);
      color: #05180c;
      border-color: transparent;
    }

    button.danger {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    main {
      flex: 1;
      padding: 12px 12px 104px;
      width: 100%;
    }

    .hint-bar {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 10px;
    }

    /* 4'lü Ana Ekran Izgarası */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 8px;
      justify-items: center;
      padding-top: 4px;
    }

    .app-tile {
      width: 100%;
      max-width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .app-icon-wrap {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      overflow: visible;
    }

    .app-icon-wrap img {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      object-fit: cover;
    }

    .pin-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pin);
      color: #111;
      font-size: 10px;
      width: 17px;
      height: 17px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .app-title {
      margin-top: 6px;
      font-size: 11.5px;
      line-height: 1.25;
      font-weight: 600;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .app-count {
      margin-top: 2px;
      font-size: 10px;
      color: var(--muted);
    }

    /* Breadcrumb */
    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .crumb {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    .crumb.current {
      color: var(--text);
      cursor: default;
    }

    /* Ağaç / Maddeler */
    .node-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px;
      margin-bottom: 9px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .node-title-btn {
      background: transparent;
      border: none;
      padding: 2px 0;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      flex: 1;
      justify-content: flex-start;
      min-width: 0;
      word-break: break-word;
    }

    .node-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .badge {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .badge.alarm {
      color: #e9d5ff;
      border-color: rgba(168, 85, 247, 0.45);
      background: rgba(168, 85, 247, 0.16);
    }

    .node-body {
      margin-top: 8px;
      font-size: 13px;
      color: #cbd5e1;
      white-space: pre-wrap;
      line-height: 1.45;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }

    .node-link {
      display: inline-block;
      margin-top: 6px;
      color: var(--accent);
      font-size: 12px;
      word-break: break-all;
      text-decoration: underline;
    }

    .node-img {
      margin-top: 8px;
      max-width: 100%;
      max-height: 210px;
      border-radius: 10px;
      display: block;
    }

    .node-audio {
      margin-top: 8px;
      width: 100%;
      height: 36px;
    }

    .children-box {
      margin-top: 9px;
      padding-left: 10px;
      border-left: 2px solid rgba(56, 189, 248, 0.25);
    }

    /* Hızlı Karalama Sabit Kutu */
    .quick-drop {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      z-index: 25;
      width: 100%;
      max-width: 480px;
      background: rgba(19, 26, 38, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 9px 10px;
    }

    .quick-drop-inner {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    input, textarea, select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13.5px;
      font-family: inherit;
    }

    textarea {
      min-height: 74px;
      resize: vertical;
    }

    /* Modal & Long-Press Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 10px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 460px;
      max-height: 86dvh;
      overflow-y: auto;
      padding: 15px;
    }

    .modal h3 {
      margin: 0 0 11px;
      font-size: 15.5px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 13px;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .menu-item {
      width: 100%;
      justify-content: flex-start;
      padding: 10px 12px;
      font-size: 13px;
      border-radius: 11px;
    }

    .emoji-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .emoji-btn {
      padding: 6px 8px;
      font-size: 16px;
      border-radius: 8px;
      background: var(--bg);
    }

    .audio-rec-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 34px 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand" onclick="goHome()">
        <img src="icon-192.png" alt="srt notes" />
        <span class="brand-title" id="headerTitle">srt notes</span>
      </div>
      <div class="header-actions" id="headerActions"></div>
    </header>

    <main id="app"></main>

    <div class="quick-drop">
      <div class="quick-drop-inner">
        <input id="quickInput" type="text" placeholder="Hızlı karalama veya link bırak..." onkeydown="if(event.key==='Enter') addQuickScratch()" />
        <button class="primary" onclick="addQuickScratch()">At</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalBox"></div>
  </div>

  <script>
    const LEGACY_KEY = "srt_notes_v1_data";
    const DB_NAME = "srt_notes_db";
    const DB_VERSION = 1;
    const STORE_NAME = "app_state";
    const STATE_KEY = "main_state";

    const EMOJI_CHOICES = ["📌", "⚡", "📝", "🎯", "🔥", "💡", "🥁", "🍺", "🚗", "🎮", "🦅", "⏰", "🎙️", "📷", "📁", "✅"];

    const SMART_ICONS = [
      { keys: ["gta", "oyun", "ps5", "fc", "nioh", "oyuncu"], icon: "🎮", color: "#6366f1" },
      { keys: ["iş", "ofis", "toplantı", "proje", "müşteri"], icon: "💼", color: "#0ea5e9" },
      { keys: ["bira", "alkol", "kokteyl", "içki", "kafe", "kahve"], icon: "🍺", color: "#d97706" },
      { keys: ["davul", "müzik", "şarkı", "ritim", "akustik", "gitar"], icon: "🥁", color: "#ec4899" },
      { keys: ["araç", "araba", "dacia", "sandero", "oto", "lastik", "yakıt"], icon: "🚗", color: "#ef4444" },
      { keys: ["balık", "olta", "deniz", "tekne", "sahil"], icon: "🎣", color: "#06b6d4" },
      { keys: ["yemek", "mangal", "tarif", "mutfak", "et"], icon: "🍖", color: "#f97316" },
      { keys: ["beşiktaş", "bjk", "maç", "futbol", "tribün"], icon: "🦅", color: "#334155" },
      { keys: ["not", "fikir", "liste", "plan"], icon: "📝", color: "#10b981" }
    ];

    function detectSmartIcon(title) {
      const lower = (title || "").toLocaleLowerCase("tr");
      for (const item of SMART_ICONS) {
        if (item.keys.some(k => lower.includes(k))) {
          return { icon: item.icon, color: item.color };
        }
      }
      const palette = ["#2563eb", "#7c3aed", "#059669", "#db2777", "#ea580c", "#0891b2"];
      let hash = 0;
      for (let i = 0; i < lower.length; i++) hash = lower.charCodeAt(i) + ((hash << 5) - hash);
      return { icon: "📌", color: palette[Math.abs(hash) % palette.length] };
    }

    function uid() {
      return "n_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
    }

    function defaultTopics() {
      return [
        {
          id: uid(),
          title: "Hızlı Karalama",
          pinned: true,
          customIcon: "",
          icon: "⚡",
          color: "#eab308",
          expanded: false,
          children: []
        }
      ];
    }

    let db = null;
    let state = {
      topics: defaultTopics(),
      currentTopicId: null,
      pathIds: []
    };
    let modalOpen = false;
    let suppressNextHistoryPop = false;
    let activeRecorder = null;
    let recordedChunks = [];
    let pendingAudioData = "";

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbGet(key) {
      return new Promise((resolve, reject) => {
        if (!db) return resolve(null);
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    function idbSet(key, val) {
      return new Promise((resolve, reject) => {
        if (!db) return resolve();
        const tx = db.transaction(STORE_NAME, "readwrite");
        const req = tx.objectStore(STORE_NAME).put(val, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function initStorage() {
      try {
        db = await openDB();
        const saved = await idbGet(STATE_KEY);
        if (saved && Array.isArray(saved.topics)) {
          state.topics = saved.topics;
          return;
        }
        const legacyRaw = localStorage.getItem(LEGACY_KEY);
        if (legacyRaw) {
          const parsed = JSON.parse(legacyRaw);
          if (Array.isArray(parsed.topics)) {
            state.topics = parsed.topics;
            await idbSet(STATE_KEY, { topics: state.topics });
            return;
          }
        }
      } catch (err) {
        console.error("Storage init error:", err);
      }
    }

    async function saveData() {
      try {
        await idbSet(STATE_KEY, { topics: state.topics });
      } catch (e) {
        alert("Kayıt sırasında bir sorun oluştu.");
      }
    }

    function pushNavState(pushToBrowser = true) {
      if (!pushToBrowser) return;
      try {
        history.pushState({
          topicId: state.currentTopicId,
          pathIds: [...state.pathIds],
          modalOpen
        }, "");
      } catch (_) {}
    }

    window.addEventListener("popstate", () => {
      if (suppressNextHistoryPop) {
        suppressNextHistoryPop = false;
        return;
      }
      if (modalOpen) {
        closeModal(false);
        return;
      }
      if (state.pathIds.length > 1) {
        state.pathIds.pop();
        render();
        return;
      }
      if (state.currentTopicId !== null) {
        state.currentTopicId = null;
        state.pathIds = [];
        render();
        return;
      }
      pushNavState(true);
    });

    function countDescendants(node) {
      if (!node.children || !node.children.length) return 0;
      let total = node.children.length;
      for (const ch of node.children) total += countDescendants(ch);
      return total;
    }

    function sortTr(list) {
      return [...list].sort((a, b) => a.title.localeCompare(b.title, "tr", { sensitivity: "base" }));
    }

    function goHome(push = true) {
      state.currentTopicId = null;
      state.pathIds = [];
      render();
      pushNavState(push);
    }

    function openTopic(topicId, push = true) {
      state.currentTopicId = topicId;
      state.pathIds = [topicId];
      render();
      pushNavState(push);
    }

    function getCurrentTopic() {
      return state.topics.find(t => t.id === state.currentTopicId) || null;
    }

    function findNodeByPath(topic, pathIds) {
      let curr = topic;
      for (let i = 1; i < pathIds.length; i++) {
        const next = (curr.children || []).find(c => c.id === pathIds[i]);
        if (!next) break;
        curr = next;
      }
      return curr;
    }

    function getActiveParentNode() {
      const topic = getCurrentTopic();
      if (!topic) return null;
      return findNodeByPath(topic, state.pathIds);
    }

    function getNodeTrail(topic, pathIds) {
      const trail = [{ id: topic.id, title: topic.title, idx: 0 }];
      let curr = topic;
      for (let i = 1; i < pathIds.length; i++) {
        const next = (curr.children || []).find(c => c.id === pathIds[i]);
        if (!next) break;
        trail.push({ id: next.id, title: next.title, idx: i });
        curr = next;
      }
      return trail;
    }

    async function addQuickScratch() {
      const input = document.getElementById("quickInput");
      const text = (input.value || "").trim();
      if (!text) return;

      let scratchTopic = state.topics.find(t => t.title.toLocaleLowerCase("tr") === "hızlı karalama");
      if (!scratchTopic) {
        scratchTopic = {
          id: uid(),
          title: "Hızlı Karalama",
          pinned: true,
          customIcon: "",
          icon: "⚡",
          color: "#eab308",
          expanded: false,
          children: []
        };
        state.topics.unshift(scratchTopic);
      }

      const isUrl = /^https?:\/\//i.test(text);
      scratchTopic.children.unshift({
        id: uid(),
        title: text.length > 48 ? text.slice(0, 48) + "..." : text,
        note: isUrl ? "" : text,
        link: isUrl ? text : "",
        image: "",
        audio: "",
        alarmAt: "",
        alarmFired: false,
        customIcon: "",
        icon: "",
        expanded: false,
        children: []
      });

      input.value = "";
      await saveData();
      render();
    }

    function compressImage(file, maxW = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function openModal(html, push = true) {
      const box = document.getElementById("modalBox");
      box.innerHTML = html;
      document.getElementById("modalBackdrop").classList.add("open");
      modalOpen = true;
      pushNavState(push);
    }

    function closeModal(rewindHistory = true) {
      stopAudioRecordingIfAny();
      document.getElementById("modalBackdrop").classList.remove("open");
      const wasOpen = modalOpen;
      modalOpen = false;
      if (wasOpen && rewindHistory && history.state && history.state.modalOpen) {
        suppressNextHistoryPop = true;
        history.back();
      }
    }

    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal(true);
    });

    function attachLongPress(el, onLongPress, onClick) {
      let timer = null;
      let triggered = false;
      let startX = 0;
      let startY = 0;

      const clearTimer = () => {
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }
      };

      el.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        triggered = false;
        startX = e.clientX;
        startY = e.clientY;
        clearTimer();
        timer = setTimeout(() => {
          triggered = true;
          if (navigator.vibrate) navigator.vibrate(25);
          onLongPress(e);
        }, 520);
      });

      el.addEventListener("pointermove", (e) => {
        if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
          clearTimer();
        }
      });

      el.addEventListener("pointerup", (e) => {
        clearTimer();
        if (!triggered && onClick) onClick(e);
      });

      el.addEventListener("pointercancel", clearTimer);
      el.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        clearTimer();
        if (!triggered) onLongPress(e);
      });
    }

    function openNewTopicModal() {
      const emojiHtml = EMOJI_CHOICES.map(em =>
        `<button type="button" class="emoji-btn" onclick="document.getElementById('mTopicEmoji').value='${em}'">${em}</button>`
      ).join("");

      openModal(`
        <h3>Yeni Konu Aç</h3>
        <div class="field">
          <label>Konu Adı</label>
          <input id="mTopicTitle" type="text" placeholder="Örn: Davul, GTA 6, Araç..." />
        </div>
        <div class="field">
          <label>Emoji İkon (Boş bırakılırsa otomatik seçilir)</label>

    function stopAudioRecordingIfAny() {

    async function toggleAudioRecord(previewId) {
      const statusEl = document.getElementById("recStatus");
      const previewEl = document.getElementById(previewId);

      if (activeRecorder && activeRecorder.state === "recording") {
        activeRecorder.stop();
        if (statusEl) statusEl.textContent = "Kaydediliyor...";
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Bu cihaz/tarayıcı ses kaydını desteklemiyor.");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
        activeRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

        activeRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };

        activeRecorder.onstop = () => {
          stream.getTracks().forEach(tr => tr.stop());
          const blob = new Blob(recordedChunks, { type: activeRecorder.mimeType || "audio/webm" });
          const reader = new FileReader();
          reader.onload = () => {
            pendingAudioData = reader.result;
            if (previewEl) {
              previewEl.src = pendingAudioData;
              previewEl.style.display = "block";
            }
            if (statusEl) statusEl.textContent = "Ses kaydı hazır";
          };
          reader.readAsDataURL(blob);
          activeRecorder = null;
        };

        activeRecorder.start();
        if (statusEl) statusEl.textContent = "Kayıt alınıyor... (Bitirmek için tekrar bas)";
      } catch (err) {
        alert("Mikrofon izni verilmedi veya açılamadı.");
      }
    }

    async function saveNode(parentId, editNodeId) {
      const topic = getCurrentTopic();
      if (!topic) return;

      const title = (document.getElementById("mNodeTitle").value || "").trim();
      if (!title) return alert("Başlık boş olamaz.");
      const note = (document.getElementById("mNodeNote").value || "").trim();
      let link = (document.getElementById("mNodeLink").value || "").trim();
      if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;
      const alarmAt = document.getElementById("mNodeAlarm").value || "";

      const file = document.getElementById("mNodeImg").files[0];
      let imgData = null;
      if (file) imgData = await compressImage(file, 900, 0.72);

      if (editNodeId) {
        const found = findNodeRecursive(topic.children, editNodeId);
        if (found) {
          found.node.title = title;
          found.node.note = note;
          found.node.link = link;
          found.node.audio = pendingAudioData;
          if (found.node.alarmAt !== alarmAt) {
            found.node.alarmAt = alarmAt;
            found.node.alarmFired = false;
          }
          if (imgData) found.node.image = imgData;
        }
      } else {
        const parentContainer = parentId === topic.id
          ? topic.children
          : (findNodeRecursive(topic.children, parentId)?.node.children || topic.children);

        parentContainer.push({
          id: uid(),
          title,
          note,
          link,
          image: imgData || "",
          audio: pendingAudioData,
          alarmAt,
          alarmFired: false,
          customIcon: "",
          icon: "",
          expanded: false,
          children: []
        });
      }

      if (alarmAt && "Notification" in window && Notification.permission === "default") {
        try { await Notification.requestPermission(); } catch (_) {}
      }

      await saveData();
      closeModal(true);
      render();
    }

    function findNodeRecursive(list, targetId, parentList = null) {
      for (let i = 0; i < (list || []).length; i++) {
        const node = list[i];
        if (node.id === targetId) return { node, list, index: i, parentList };
        const res = findNodeRecursive(node.children || [], targetId, node.children);
        if (res) return res;
      }
      return null;
    }

      const topic = getCurrentTopic();

      if (!topic || !targetTopic) return;

    function formatNodeForWhatsApp(node, depth = 0) {
      const indent = "  ".repeat(depth);
      let out = `${indent}• *${node.title}*`;
      if (node.note) out += `\n${indent}  ${node.note}`;
      if (node.link) out += `\n${indent}  🔗 ${node.link}`;
      if (node.alarmAt) out += `\n${indent}  ⏰ ${node.alarmAt.replace("T", " ")}`;
      if (node.children && node.children.length) {
        for (const ch of sortTr(node.children)) {
          out += `\n` + formatNodeForWhatsApp(ch, depth + 1);
        }
      }
      return out;
    }

    function shareToWhatsApp(text) {
      const url = "https://wa.me/?text=" + encodeURIComponent(text);
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function shareNodeWA(nodeId) {
      const topic = getCurrentTopic();
      if (!topic) return;
      const found = findNodeRecursive(topic.children, nodeId);
      if (!found) return;
      shareToWhatsApp(formatNodeForWhatsApp(found.node, 0));
    }

    function shareTopicByIdWA(topicId) {
      const topic = state.topics.find(t => t.id === topicId);
      if (!topic) return;
      let text = `*${topic.title}*\n`;
      for (const ch of sortTr(topic.children || [])) {
        text += `\n` + formatNodeForWhatsApp(ch, 0);
      }
      shareToWhatsApp(text.trim());
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify({ topics: state.topics }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "srt-notes-yedek.json";
      a.click();
    }

    function importBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed.topics)) throw new Error();
          state.topics = parsed.topics;
          await saveData();
          goHome(true);
          alert("Yedek geri yüklendi.");
        } catch {
          alert("Geçersiz JSON yedek dosyası.");
        }
      };
      reader.readAsText(file);
    }

    function playAlarmBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 600);
      } catch (_) {}
    }

    async function checkAlarms() {
      const now = Date.now();
      let changed = false;

      const scan = (nodes) => {
        for (const n of nodes || []) {
          if (n.alarmAt && !n.alarmFired) {
            const targetTime = new Date(n.alarmAt).getTime();
            if (!Number.isNaN(targetTime) && now >= targetTime) {
              n.alarmFired = true;
              changed = true;
              playAlarmBeep();
              if ("Notification" in window && Notification.permission === "granted") {
                try { new Notification("srt notes Alarm", { body: n.title }); } catch (_) {}
              }
              alert(`⏰ Hatırlatıcı: ${n.title}${n.note ? "\n" + n.note : ""}`);
            }
          }
          if (n.children && n.children.length) scan(n.children);
        }
      };

      for (const t of state.topics) scan(t.children);
      if (changed) await saveData();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    function render() {
      const headerTitle = document.getElementById("headerTitle");
      const headerActions = document.getElementById("headerActions");
      const app = document.getElementById("app");
      const currentTopic = getCurrentTopic();

      if (!currentTopic) {
        headerTitle.textContent = "srt notes";
        headerActions.innerHTML = `
          <button onclick="exportBackup()">Yedek</button>
          <button onclick="document.getElementById('importFile').click()">İçe Al</button>
          <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importBackup(this.files[0])" />
          <button class="primary" onclick="openNewTopicModal()">+ Konu</button>
        `;

        const pinned = sortTr(state.topics.filter(t => t.pinned));
        const others = sortTr(state.topics.filter(t => !t.pinned));
        const ordered = [...pinned, ...others];

        if (!ordered.length) {
          app.innerHTML = `<div class="empty-msg">Henüz konu yok. Sağ üstten <b>+ Konu</b> ile başlayabilirsin.</div>`;
          return;
        }

        app.innerHTML = `
          <div class="hint-bar">Konulara veya maddelere basılı tutarak menüyü açabilirsin</div>
          <div class="grid-4" id="topicsGrid"></div>
        `;

        const grid = document.getElementById("topicsGrid");
        ordered.forEach(t => {
          const cnt = countDescendants(t);
          const iconHtml = t.customIcon
            ? `<img src="${escapeAttr(t.customIcon)}" alt="" />`
            : `<span>${escapeHtml(t.icon || "📌")}</span>`;

          const tile = document.createElement("div");
          tile.className = "app-tile";
          tile.innerHTML = `
            <div class="app-icon-wrap" style="background:${t.customIcon ? "transparent" : (t.color || "#2563eb")}">
              ${iconHtml}
              ${t.pinned ? `<span class="pin-badge">📌</span>` : ""}
            </div>
            <div class="app-title">${escapeHtml(t.title)}</div>
            <div class="app-count">(${cnt})</div>
          `;
          attachLongPress(
            tile,
            () => openTopicLongPressMenu(t.id),
            () => openTopic(t.id)
          );
          grid.appendChild(tile);
        });
      } else {
        headerTitle.textContent = currentTopic.title;
        headerActions.innerHTML = `
          <button onclick="goHome()">Ana Ekran</button>
          <button class="primary" onclick="openNodeModal('${currentTopic.id}')">+ Madde</button>
        `;

        const trail = getNodeTrail(currentTopic, state.pathIds);
        const activeParent = getActiveParentNode();
        const items = sortTr((activeParent && activeParent.children) || []);

        app.innerHTML = `
          <div class="breadcrumb">
            <span class="crumb" onclick="goHome()">Ana Ekran</span>
            ${trail.map((item, i) => {
              const isLast = i === trail.length - 1;
              return `<span>/</span><span class="crumb ${isLast ? "current" : ""}" onclick="jumpTrail(${item.idx})">${escapeHtml(item.title)}</span>`;
            }).join("")}
          </div>
          <div id="nodesList"></div>
        `;

        const container = document.getElementById("nodesList");
        if (!items.length) {
          container.innerHTML = `<div class="empty-msg">Bu dalda henüz madde yok. <b>+ Madde</b> ile ekleyebilirsin.</div>`;
        } else {
          items.forEach(n => container.appendChild(buildNodeElement(n)));
        }
      }
    }

    function buildNodeElement(node) {
      const hasChildren = Array.isArray(node.children) && node.children.length > 0;
      const isOpen = !!node.expanded;
      const sortedChildren = hasChildren ? sortTr(node.children) : [];

      const card = document.createElement("div");
      card.className = "node-card";

      const badges = [];
      if (node.icon || node.customIcon) {
        badges.push(`<span class="badge">${node.customIcon ? "🖼️ İkon" : escapeHtml(node.icon)}</span>`);
      }
      if (node.alarmAt) {
        badges.push(`<span class="badge alarm">⏰ ${escapeHtml(node.alarmAt.replace("T", " "))}${node.alarmFired ? " ✓" : ""}</span>`);
      }
      if (node.audio) {
        badges.push(`<span class="badge">🎙️ Ses</span>`);
      }

      card.innerHTML = `
        <div class="node-header">
          <button type="button" class="node-title-btn">
            ${isOpen ? "▾" : "▸"} ${escapeHtml(node.title)} ${hasChildren ? `<span style="color:var(--muted);font-size:11.5px;">(${node.children.length})</span>` : ""}
          </button>
          <button type="button" onclick="drillIntoNode('${node.id}')">İçine Gir →</button>
        </div>
        ${badges.length ? `<div class="node-meta">${badges.join("")}</div>` : ""}
        ${isOpen ? `
          ${node.note ? `<div class="node-body">${escapeHtml(node.note)}</div>` : ""}
          ${node.link ? `<a class="node-link" href="${escapeAttr(node.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(node.link)}</a>` : ""}
          ${node.image ? `<img class="node-img" src="${escapeAttr(node.image)}" alt="" />` : ""}
          ${node.audio ? `<audio class="node-audio" controls src="${escapeAttr(node.audio)}"></audio>` : ""}
          <div class="children-box" id="children_${node.id}"></div>
        ` : ""}
      `;

      const titleBtn = card.querySelector(".node-title-btn");
      attachLongPress(
        titleBtn,
        () => openNodeLongPressMenu(node.id),
        () => toggleExpand(node.id)
      );

      attachLongPress(
        card,
        () => openNodeLongPressMenu(node.id),
        null
      );

      if (isOpen && sortedChildren.length) {
        const childBox = card.querySelector(`#children_${node.id}`);
        sortedChildren.forEach(ch => childBox.appendChild(buildNodeElement(ch)));
      }

      return card;
    }

    function jumpTrail(idx) {
      state.pathIds = state.pathIds.slice(0, idx + 1);
      render();
      pushNavState(true);
    }

    function drillIntoNode(nodeId) {
      state.pathIds.push(nodeId);
      render();
      pushNavState(true);
    }

    (async function boot() {
      await initStorage();
      render();
      pushNavState(true);
      await checkAlarms();
      setInterval(checkAlarms, 15000);
    })();
  </script>
</body>
</html>
