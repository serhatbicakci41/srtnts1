<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>srt notes</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-2: #1b2434;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f6fb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --pin: #f59e0b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 15, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.2px;
    }

    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      object-fit: cover;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: var(--accent);
      color: #06131d;
      border-color: transparent;
    }

    button.success {
      background: var(--accent-2);
      color: #05180c;
      border-color: transparent;
    }

    button.danger {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    main {
      flex: 1;
      padding: 14px 14px 110px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* 4'lü Ana Ekran Izgarası */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 10px;
      justify-items: center;
      padding-top: 6px;
    }

    .app-tile {
      width: 100%;
      max-width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .app-icon-wrap {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      overflow: visible;
    }

    .app-icon-wrap img {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: cover;
    }

    .pin-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pin);
      color: #111;
      font-size: 11px;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .app-title {
      margin-top: 7px;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 600;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .app-count {
      margin-top: 2px;
      font-size: 10.5px;
      color: var(--muted);
    }

    /* Breadcrumb */
    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .crumb {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    .crumb.current {
      color: var(--text);
      cursor: default;
    }

    /* Ağaç / Maddeler */
    .node-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .node-title-btn {
      background: transparent;
      border: none;
      padding: 2px 0;
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      flex: 1;
      justify-content: flex-start;
    }

    .node-body {
      margin-top: 8px;
      font-size: 13.5px;
      color: #cbd5e1;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .node-link {
      display: inline-block;
      margin-top: 6px;
      color: var(--accent);
      font-size: 12.5px;
      word-break: break-all;
      text-decoration: underline;
    }

    .node-img {
      margin-top: 8px;
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      display: block;
    }

    .node-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .node-toolbar button {
      padding: 5px 8px;
      font-size: 11.5px;
    }

    .children-box {
      margin-top: 10px;
      padding-left: 12px;
      border-left: 2px solid rgba(56, 189, 248, 0.25);
    }

    /* Hızlı Karalama Sabit Kutu */
    .quick-drop {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      background: rgba(19, 26, 38, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
    }

    .quick-drop-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input, textarea, select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      max-height: 88dvh;
      overflow-y: auto;
      padding: 16px;
    }

    .modal h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .field {
      margin-bottom: 11px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 36px 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand" onclick="goHome()" style="cursor:pointer;">
      <img src="icon-192.png" alt="srt notes" />
      <span>srt notes</span>
    </div>
    <div class="header-actions" id="headerActions"></div>
  </header>

  <main id="app"></main>

  <div class="quick-drop">
    <div class="quick-drop-inner">
      <input id="quickInput" type="text" placeholder="Hızlı karalama veya link bırak..." onkeydown="if(event.key==='Enter') addQuickScratch()" />
      <button class="primary" onclick="addQuickScratch()">At</button>
    </div>
  </div>

  <!-- Genel Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalBox"></div>
  </div>

  <script>
    const STORAGE_KEY = "srt_notes_v1_data";

    const SMART_ICONS = [
      { keys: ["gta", "oyun", "ps5", "fc", "nioh", "oyuncu"], icon: "🎮", color: "#6366f1" },
      { keys: ["iş", "ofis", "toplantı", "proje", "müşteri"], icon: "💼", color: "#0ea5e9" },
      { keys: ["bira", "alkol", "kokteyl", "içki", "kafe", "kahve"], icon: "🍺", color: "#d97706" },
      { keys: ["davul", "müzik", "şarkı", "ritim", "akustik", "gitar"], icon: "🥁", color: "#ec4899" },
      { keys: ["araç", "araba", "dacia", "sandero", "oto", "lastik", "yakıt"], icon: "🚗", color: "#ef4444" },
      { keys: ["balık", "olta", "deniz", "tekne", "sahil"], icon: "🎣", color: "#06b6d4" },
      { keys: ["yemek", "mangal", "tarif", "mutfak", "et"], icon: "🍖", color: "#f97316" },
      { keys: ["beşiktaş", "bjk", "maç", "futbol", "tribün"], icon: "🦅", color: "#334155" },
      { keys: ["not", "fikir", "liste", "plan"], icon: "📝", color: "#10b981" }
    ];

    function detectSmartIcon(title) {
      const lower = (title || "").toLocaleLowerCase("tr");
      for (const item of SMART_ICONS) {
        if (item.keys.some(k => lower.includes(k))) {
          return { icon: item.icon, color: item.color };
        }
      }
      const palette = ["#2563eb", "#7c3aed", "#059669", "#db2777", "#ea580c", "#0891b2"];
      let hash = 0;
      for (let i = 0; i < lower.length; i++) hash = lower.charCodeAt(i) + ((hash << 5) - hash);
      return { icon: "📌", color: palette[Math.abs(hash) % palette.length] };
    }

    function uid() {
      return "n_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
    }

    function defaultData() {
      return {
        topics: [
          {
            id: uid(),
            title: "Hızlı Karalama",
            pinned: true,
            customIcon: "",
            icon: "⚡",
            color: "#eab308",
            expanded: false,
            children: []
          }
        ],
        currentTopicId: null,
        pathIds: []
      };
    }

    let state = loadData();

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultData();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.topics)) return defaultData();
        return {
          topics: parsed.topics,
          currentTopicId: null,
          pathIds: []
        };
      } catch {
        return defaultData();
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ topics: state.topics }));
      } catch (e) {
        alert("Depolama alanı dolu olabilir (görseller çok büyükse küçültülmüş halini kullan).");
      }
    }

    function countDescendants(node) {
      if (!node.children || !node.children.length) return 0;
      let total = node.children.length;
      for (const ch of node.children) total += countDescendants(ch);
      return total;
    }

    function sortTr(list) {
      return [...list].sort((a, b) => a.title.localeCompare(b.title, "tr", { sensitivity: "base" }));
    }

    function goHome() {
      state.currentTopicId = null;
      state.pathIds = [];
      render();
    }

    function openTopic(topicId) {
      state.currentTopicId = topicId;
      state.pathIds = [topicId];
      render();
    }

    function getCurrentTopic() {
      return state.topics.find(t => t.id === state.currentTopicId) || null;
    }

    function findNodeByPath(topic, pathIds) {
      let curr = topic;
      for (let i = 1; i < pathIds.length; i++) {
        const next = (curr.children || []).find(c => c.id === pathIds[i]);
        if (!next) break;
        curr = next;
      }
      return curr;
    }

    function getActiveParentNode() {
      const topic = getCurrentTopic();
      if (!topic) return null;
      return findNodeByPath(topic, state.pathIds);
    }

    function getNodeTrail(topic, pathIds) {
      const trail = [{ id: topic.id, title: topic.title, idx: 0 }];
      let curr = topic;
      for (let i = 1; i < pathIds.length; i++) {
        const next = (curr.children || []).find(c => c.id === pathIds[i]);
        if (!next) break;
        trail.push({ id: next.id, title: next.title, idx: i });
        curr = next;
      }
      return trail;
    }

    function addQuickScratch() {
      const input = document.getElementById("quickInput");
      const text = (input.value || "").trim();
      if (!text) return;

      let scratchTopic = state.topics.find(t => t.title.toLocaleLowerCase("tr") === "hızlı karalama");
      if (!scratchTopic) {
        scratchTopic = {
          id: uid(),
          title: "Hızlı Karalama",
          pinned: true,
          customIcon: "",
          icon: "⚡",
          color: "#eab308",
          expanded: false,
          children: []
        };
        state.topics.unshift(scratchTopic);
      }

      const isUrl = /^https?:\/\//i.test(text);
      scratchTopic.children.unshift({
        id: uid(),
        title: text.length > 48 ? text.slice(0, 48) + "..." : text,
        note: isUrl ? "" : text,
        link: isUrl ? text : "",
        image: "",
        expanded: false,
        children: []
      });

      input.value = "";
      saveData();
      render();
    }

    function compressImage(file, maxW = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function openModal(html) {
      const box = document.getElementById("modalBox");
      box.innerHTML = html;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    function openNewTopicModal() {
      openModal(`
        <h3>Yeni Konu Aç</h3>
        <div class="field">
          <label>Konu Adı</label>
          <input id="mTopicTitle" type="text" placeholder="Örn: Davul, GTA 6, Araç..." />
        </div>
        <div class="field">
          <label>Özel Görsel (İsteğe bağlı - boş bırakılırsa otomatik ikon seçilir)</label>
          <input id="mTopicImg" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label><input id="mTopicPin" type="checkbox" style="width:auto; margin-right:6px;" />En başa sabitle (📌)</label>
        </div>
        <div class="modal-footer">
          <button onclick="closeModal()">İptal</button>
          <button class="primary" onclick="saveNewTopic()">Oluştur</button>
        </div>
      `);
    }

    async function saveNewTopic() {
      const title = (document.getElementById("mTopicTitle").value || "").trim();
      if (!title) return alert("Konu adı yazmalısın.");
      const pinned = document.getElementById("mTopicPin").checked;
      const file = document.getElementById("mTopicImg").files[0];
      let customIcon = "";
      if (file) customIcon = await compressImage(file, 240, 0.8);

      const smart = detectSmartIcon(title);
      state.topics.push({
        id: uid(),
        title,
        pinned,
        customIcon,
        icon: smart.icon,
        color: smart.color,
        expanded: false,
        children: []
      });
      saveData();
      closeModal();
      render();
    }

    function openNodeModal(parentId, editNodeId = null) {
      const topic = getCurrentTopic();
      if (!topic) return;

      let existing = null;
      if (editNodeId) {
        const found = findNodeRecursive(topic.children, editNodeId);
        if (found) existing = found.node;
      }

      openModal(`
        <h3>${existing ? "Maddeyi Düzenle" : "Yeni Alt Başlık / Madde Ekle"}</h3>
        <div class="field">
          <label>Başlık</label>
          <input id="mNodeTitle" type="text" value="${escapeAttr(existing ? existing.title : "")}" placeholder="Başlık yaz..." />
        </div>
        <div class="field">
          <label>Açıklama / Not</label>
          <textarea id="mNodeNote" placeholder="Detaylar...">${escapeHtml(existing ? (existing.note || "") : "")}</textarea>
        </div>
        <div class="field">
          <label>İnternet Linki</label>
          <input id="mNodeLink" type="url" value="${escapeAttr(existing ? (existing.link || "") : "")}" placeholder="https://..." />
        </div>
        <div class="field">
          <label>Görsel Ekle (Otomatik sıkıştırılır)</label>
          <input id="mNodeImg" type="file" accept="image/*" />
        </div>
        <div class="modal-footer">
          <button onclick="closeModal()">İptal</button>
          <button class="primary" onclick="saveNode('${parentId}', ${editNodeId ? `'${editNodeId}'` : "null"})">Kaydet</button>
        </div>
      `);
    }

    async function saveNode(parentId, editNodeId) {
      const topic = getCurrentTopic();
      if (!topic) return;

      const title = (document.getElementById("mNodeTitle").value || "").trim();
      if (!title) return alert("Başlık boş olamaz.");
      const note = (document.getElementById("mNodeNote").value || "").trim();
      let link = (document.getElementById("mNodeLink").value || "").trim();
      if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;

      const file = document.getElementById("mNodeImg").files[0];
      let imgData = null;
      if (file) imgData = await compressImage(file, 900, 0.72);

      if (editNodeId) {
        const found = findNodeRecursive(topic.children, editNodeId);
        if (found) {
          found.node.title = title;
          found.node.note = note;
          found.node.link = link;
          if (imgData) found.node.image = imgData;
        }
      } else {
        const parentContainer = parentId === topic.id
          ? topic.children
          : (findNodeRecursive(topic.children, parentId)?.node.children || topic.children);

        parentContainer.push({
          id: uid(),
          title,
          note,
          link,
          image: imgData || "",
          expanded: false,
          children: []
        });
      }

      saveData();
      closeModal();
      render();
    }

    function findNodeRecursive(list, targetId, parentList = null) {
      for (let i = 0; i < (list || []).length; i++) {
        const node = list[i];
        if (node.id === targetId) return { node, list, index: i, parentList };
        const res = findNodeRecursive(node.children || [], targetId, node.children);
        if (res) return res;
      }
      return null;
    }

    function toggleExpand(nodeId) {
      const topic = getCurrentTopic();
      if (!topic) return;
      const found = findNodeRecursive(topic.children, nodeId);
      if (found) {
        found.node.expanded = !found.node.expanded;
        saveData();
        render();
      }
    }

    function deleteNode(nodeId) {
      const topic = getCurrentTopic();
      if (!topic) return;
      const found = findNodeRecursive(topic.children, nodeId);
      if (!found) return;
      if (!confirm(`"${found.node.title}" ve alt dalları silinsin mi?`)) return;
      found.list.splice(found.index, 1);
      saveData();
      render();
    }

    function openMoveModal(nodeId) {
      const topic = getCurrentTopic();
      if (!topic) return;
      const found = findNodeRecursive(topic.children, nodeId);
      if (!found) return;

      const options = state.topics.map(t => `<option value="${t.id}" ${t.id === topic.id ? "selected" : ""}>${escapeHtml(t.title)}</option>`).join("");
      openModal(`
        <h3>Dalı Başka Konuya Taşı</h3>
        <div class="field">
          <label>Taşınacak Dal: <strong>${escapeHtml(found.node.title)}</strong></label>
        </div>
        <div class="field">
          <label>Hedef Konu</label>
          <select id="mMoveTarget">${options}</select>
        </div>
        <div class="modal-footer">
          <button onclick="closeModal()">İptal</button>
          <button class="primary" onclick="confirmMove('${nodeId}')">Taşı</button>
        </div>
      `);
    }

    function confirmMove(nodeId) {
      const topic = getCurrentTopic();
      const targetTopicId = document.getElementById("mMoveTarget").value;
      const targetTopic = state.topics.find(t => t.id === targetTopicId);
      if (!topic || !targetTopic) return;

      const found = findNodeRecursive(topic.children, nodeId);
      if (!found) return;

      const [moved] = found.list.splice(found.index, 1);
      moved.expanded = false;
      targetTopic.children.push(moved);

      saveData();
      closeModal();
      render();
    }

    function togglePinCurrentTopic() {
      const topic = getCurrentTopic();
      if (!topic) return;
      topic.pinned = !topic.pinned;
      saveData();
      render();
    }

    function deleteCurrentTopic() {
      const topic = getCurrentTopic();
      if (!topic) return;
      if (!confirm(`"${topic.title}" konusu tamamen silinsin mi?`)) return;
      state.topics = state.topics.filter(t => t.id !== topic.id);
      saveData();
      goHome();
    }

    function formatNodeForWhatsApp(node, depth = 0) {
      const indent = "  ".repeat(depth);
      let out = `${indent}• *${node.title}*`;
      if (node.note) out += `\n${indent}  ${node.note}`;
      if (node.link) out += `\n${indent}  🔗 ${node.link}`;
      if (node.children && node.children.length) {
        for (const ch of sortTr(node.children)) {
          out += `\n` + formatNodeForWhatsApp(ch, depth + 1);
        }
      }
      return out;
    }

    function shareToWhatsApp(text) {
      const url = "https://wa.me/?text=" + encodeURIComponent(text);
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function shareNodeWA(nodeId) {
      const topic = getCurrentTopic();
      if (!topic) return;
      const found = findNodeRecursive(topic.children, nodeId);
      if (!found) return;
      shareToWhatsApp(formatNodeForWhatsApp(found.node, 0));
    }

    function shareTopicWA() {
      const topic = getCurrentTopic();
      if (!topic) return;
      let text = `*${topic.title}*\n`;
      for (const ch of sortTr(topic.children || [])) {
        text += `\n` + formatNodeForWhatsApp(ch, 0);
      }
      shareToWhatsApp(text.trim());
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify({ topics: state.topics }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "srt-notes-yedek.json";
      a.click();
    }

    function importBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed.topics)) throw new Error();
          state.topics = parsed.topics;
          saveData();
          goHome();
          alert("Yedek geri yüklendi.");
        } catch {
          alert("Geçersiz JSON yedek dosyası.");
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    function render() {
      const headerActions = document.getElementById("headerActions");
      const app = document.getElementById("app");
      const currentTopic = getCurrentTopic();

      if (!currentTopic) {
        headerActions.innerHTML = `
          <button onclick="exportBackup()">Yedek</button>
          <button onclick="document.getElementById('importFile').click()">İçe Al</button>
          <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importBackup(this.files[0])" />
          <button class="primary" onclick="openNewTopicModal()">+ Konu</button>
        `;

        const pinned = sortTr(state.topics.filter(t => t.pinned));
        const others = sortTr(state.topics.filter(t => !t.pinned));
        const ordered = [...pinned, ...others];

        if (!ordered.length) {
          app.innerHTML = `<div class="empty-msg">Henüz konu yok. Sağ üstten <b>+ Konu</b> ile başlayabilirsin.</div>`;
          return;
        }

        app.innerHTML = `
          <div class="grid-4">
            ${ordered.map(t => {
              const cnt = countDescendants(t);
              const iconHtml = t.customIcon
                ? `<img src="${t.customIcon}" alt="" />`
                : `<span>${escapeHtml(t.icon || "📌")}</span>`;
              return `
                <div class="app-tile" onclick="openTopic('${t.id}')">
                  <div class="app-icon-wrap" style="background:${t.customIcon ? "transparent" : (t.color || "#2563eb")}">
                    ${iconHtml}
                    ${t.pinned ? `<span class="pin-badge">📌</span>` : ""}
                  </div>
                  <div class="app-title">${escapeHtml(t.title)}</div>
                  <div class="app-count">(${cnt})</div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      } else {
        headerActions.innerHTML = `
          <button onclick="goHome()">Ana Ekran</button>
          <button onclick="togglePinCurrentTopic()">${currentTopic.pinned ? "Sabiti Kaldır" : "📌 Sabitle"}</button>
          <button class="success" onclick="shareTopicWA()">WA Paylaş</button>
          <button class="primary" onclick="openNodeModal('${currentTopic.id}')">+ Madde</button>
          <button class="danger" onclick="deleteCurrentTopic()">Sil</button>
        `;

        const trail = getNodeTrail(currentTopic, state.pathIds);
        const activeParent = getActiveParentNode();
        const items = sortTr((activeParent && activeParent.children) || []);

        app.innerHTML = `
          <div class="breadcrumb">
            <span class="crumb" onclick="goHome()">Ana Ekran</span>
            ${trail.map((item, i) => {
              const isLast = i === trail.length - 1;
              return `<span>/</span><span class="crumb ${isLast ? "current" : ""}" onclick="jumpTrail(${item.idx})">${escapeHtml(item.title)}</span>`;
            }).join("")}
          </div>

          ${items.length ? items.map(n => renderNodeCard(n)).join("") : `<div class="empty-msg">Bu dalda henüz madde yok. <b>+ Madde</b> ile ekleyebilirsin.</div>`}
        `;
      }
    }

    function jumpTrail(idx) {
      state.pathIds = state.pathIds.slice(0, idx + 1);
      render();
    }

    function drillIntoNode(nodeId) {
      state.pathIds.push(nodeId);
      render();
    }

    function renderNodeCard(node) {
      const hasChildren = Array.isArray(node.children) && node.children.length > 0;
      const isOpen = !!node.expanded;
      const sortedChildren = hasChildren ? sortTr(node.children) : [];

      return `
        <div class="node-card">
          <div class="node-header">
            <button class="node-title-btn" onclick="toggleExpand('${node.id}')">
              ${isOpen ? "▾" : "▸"} ${escapeHtml(node.title)} ${hasChildren ? `<span style="color:var(--muted);font-size:12px;">(${node.children.length})</span>` : ""}
            </button>
            <button onclick="drillIntoNode('${node.id}')">İçine Gir →</button>
          </div>

          ${isOpen ? `
            ${node.note ? `<div class="node-body">${escapeHtml(node.note)}</div>` : ""}
            ${node.link ? `<a class="node-link" href="${escapeAttr(node.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(node.link)}</a>` : ""}
            ${node.image ? `<img class="node-img" src="${node.image}" alt="" />` : ""}

            <div class="node-toolbar">
              <button onclick="openNodeModal('${node.id}')">+ Alt Dal</button>
              <button onclick="openNodeModal(null, '${node.id}')">Düzenle</button>
              <button onclick="openMoveModal('${node.id}')">Taşı</button>
              <button class="success" onclick="shareNodeWA('${node.id}')">WA</button>
              <button class="danger" onclick="deleteNode('${node.id}')">Sil</button>
            </div>

            ${sortedChildren.length ? `
              <div class="children-box">
                ${sortedChildren.map(ch => renderNodeCard(ch)).join("")}
              </div>
            ` : ""}
          ` : ""}
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
